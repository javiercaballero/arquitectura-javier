name: CI PULL REQUEST

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Disabling shallow clones is recommended for improving the relevancy of reporting
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
        
      #  SOLO SI LOS TESTS PASAN → SE EJECUTA SONAR
      - name: SonarCloud Analysis
        env:
          # SonarScanner for Maven picks up SONAR_TOKEN automatically
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >
          mvn -B -ntp verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=javiercaballero
          -Dsonar.projectKey=javiercaballero_arquitectura-javier
          -Dsonar.verbose=true
          -Dsonar.qualitygate.wait=true

  fallo:
    runs-on: ubuntu-latest
    steps:
      - name: Fallar vía script
        uses: actions/github-script@v7
        with:
          script:
            core.setFailed("Fallando para probar branch protection")
